# Runs the three Mandate jurors every 10 minutes. Each juror posts from its own key and its own model provider:
# Claude Haiku 5.5 (Anthropic), gpt-oss-120b (Groq, Pollinations fallback), Gemini Flash (Google).
# Secrets and variables are listed in docs/JURORS.md. Until the DOCKET variable is set the job exits early.
name: jurors

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: jurors
  cancel-in-progress: false

permissions:
  contents: write # rationale documents are committed under evidence/ and served from raw GitHub URLs

jobs:
  jurors:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HEARING_CHAIN_ID: "84532"
      DOCKET: ${{ vars.DOCKET }}
      DOCKET_START_BLOCK: ${{ vars.DOCKET_START_BLOCK }}
      RPC_URL_84532: ${{ secrets.RPC_URL_84532 || 'https://sepolia.base.org' }}
      RPC_URL_1301: ${{ secrets.RPC_URL_1301 || 'https://sepolia.unichain.org' }}
      RATIONALE_STORE: git
      RATIONALE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/evidence
      # Prompt Guard (Groq) is the third injection signal for every juror.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$DOCKET" ] || [ -z "$DOCKET_START_BLOCK" ]; then
            echo "::notice::DOCKET or DOCKET_START_BLOCK repository variable is not set; nothing to do."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.config.outputs.ready == 'true'
        with:
          version: 12.8.1

      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: workers/pnpm-lock.yaml

      - name: Install workers
        if: steps.config.outputs.ready == 'true'
        working-directory: workers
        run: pnpm install --frozen-lockfile

      - name: Restore checkpoints
        if: steps.config.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: workers/.state
          key: juror-state-${{ github.run_id }}
          restore-keys: juror-state-

      - name: Configure git for evidence commits
        if: steps.config.outputs.ready == 'true'
        run: |
          git config user.name "mandate-jurors"
          git config user.email "mandate-jurors@users.noreply.github.com"

      - name: Juror 1 (Claude Haiku 5.5, Anthropic)
        if: steps.config.outputs.ready == 'true'
        working-directory: workers
        env:
          JUROR_ID: "1"
          JUROR_PRIVATE_KEY: ${{ secrets.JUROR_KEY_1 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_API_KEY_2: ${{ secrets.ANTHROPIC_API_KEY_2 }}
          CHECKPOINT_FILE: ${{ github.workspace }}/workers/.state/juror-1.json
        run: pnpm --silent juror --once

      - name: Juror 2 (gpt-oss-120b on Groq, falls back to gpt-oss-20b on Pollinations)
        if: always() && steps.config.outputs.ready == 'true'
        working-directory: workers
        env:
          JUROR_ID: "2"
          JUROR_PRIVATE_KEY: ${{ secrets.JUROR_KEY_2 }}
          CHECKPOINT_FILE: ${{ github.workspace }}/workers/.state/juror-2.json
        run: pnpm --silent juror --once

      - name: Juror 3 (Gemini Flash, Google)
        if: always() && steps.config.outputs.ready == 'true'
        working-directory: workers
        env:
          JUROR_ID: "3"
          JUROR_PRIVATE_KEY: ${{ secrets.JUROR_KEY_3 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          CHECKPOINT_FILE: ${{ github.workspace }}/workers/.state/juror-3.json
        run: pnpm --silent juror --once
