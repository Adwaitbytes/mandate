# CI on every push and pull request (MASTER_PROMPT 11.2): contracts (fmt, build, test, coverage), Slither,
# lint, typecheck and unit tests for every TypeScript workspace, the writing standard, and a full-history
# secret scan. Playwright against the Vercel preview lives in preview-e2e.yml. `make ci` runs the same steps.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_VERSION: v1.8.4
  NODE_VERSION: "26" # web/ and workers/ declare engines node >=26
  PNPM_VERSION: 12.8.1
  SLITHER_VERSION: 0.11.6
  GITLEAKS_VERSION: 8.30.1

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: forge fmt --check
        run: forge fmt --check
      - name: forge build --deny warnings
        run: forge build --deny warnings
      # No fork tests in this repo; test/unit/CodeSize.t.sol checks EIP-170 on the optimized build here.
      - name: forge test (unit, integration, fuzz, invariant, script)
        run: forge test
      - name: forge coverage
        # Coverage builds without the optimizer, so the code-size check is not meaningful here.
        run: |
          forge coverage --report summary --report lcov \
            --no-match-contract "Fork|CodeSize" --no-match-coverage "(test|script|lib)/" | tee coverage-summary.txt
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            contracts/coverage-summary.txt
            contracts/lcov.info
          if-no-files-found: error

  slither:
    name: slither
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Slither
        run: python -m pip install "slither-analyzer==${SLITHER_VERSION}"
      - name: slither
        working-directory: contracts
        run: slither . --config-file ../slither.config.json --json ../slither.json
      - name: Gate on High findings (tools/slither-triage.json)
        run: node tools/slither-gate.mjs slither.json tools/slither-triage.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: slither
          path: slither.json
          if-no-files-found: ignore

  node:
    name: ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        workspace: [web, workers]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v7
      # workers/test/canonical.test.ts cross-checks keccak256 against `cast`.
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ matrix.workspace }}/pnpm-lock.yaml
      # The lockfile pins esbuild, whose postinstall pnpm 12 refuses unless allowed; web/pnpm-workspace.yaml has no
      # allowBuilds entry yet, so CI grants exactly that one package.
      - run: pnpm install --frozen-lockfile --allow-build esbuild
      - name: lint (Biome)
        run: pnpm run --if-present lint
      # PageProps and RouteContext are global types Next.js writes to .next/types; a clean checkout has none.
      - name: Next.js route types
        if: matrix.workspace == 'web'
        run: pnpm exec next typegen
      - name: typecheck
        run: pnpm run typecheck
      - name: unit tests
        run: pnpm run test

  writing:
    name: writing standard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node --test tools/check-writing.test.mjs
      - run: node tools/check-writing.mjs

  docs:
    name: README and JUDGE.md match evidence/summary.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: workers/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --allow-build esbuild
        working-directory: workers
      - name: generated docs are current
        run: make docs-check
      - name: verify script unit tests
        run: make verify-test

  secrets:
    name: secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks CLI rather than gitleaks-action: on push the action scans only the pushed commits, and the
      # standard is no secret anywhere in history. Pinned and checksum-verified.
      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${tarball}\$" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: gitleaks (every commit, .gitleaksignore and .gitleaks.toml applied)
        run: gitleaks git --redact --verbose --no-banner --exit-code 1 .
